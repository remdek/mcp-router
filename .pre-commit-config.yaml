repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml]
        pass_filenames: false
        additional_dependencies:
          - fastapi>=0.115.0
          - uvicorn[standard]>=0.32.0
          - httpx>=0.28.0
          - mcp>=1.12.0,<2
          - pydantic>=2.10.0
          - pydantic-settings>=2.6.0
          - aiosqlite>=0.20.0
          - sqlite-vec>=0.1.6
          - python-dotenv>=1.0.0
          - websockets>=13.0
          - types-PyYAML
          - fastembed>=0.5.1,<0.6

  - repo: local
    hooks:
      - id: lint-imports
        name: lint-imports
        entry: bash -c 'PYTHONPATH=src lint-imports'
        language: python
        pass_filenames: false
        always_run: true
        additional_dependencies:
          - import-linter>=2.1
      - id: pytest
        name: pytest
        entry: bash -c 'PYTHONPATH=src pytest -q'
        language: python
        pass_filenames: false
        always_run: true
        additional_dependencies:
          - pytest>=8.0
          - pytest-asyncio>=0.24
          - respx>=0.22
          - fastapi>=0.115.0
          - uvicorn[standard]>=0.32.0
          - httpx>=0.28.0
          - mcp>=1.12.0,<2
          - pydantic>=2.10.0
          - pydantic-settings>=2.6.0
          - aiosqlite>=0.20.0
          - sqlite-vec>=0.1.6
          - python-dotenv>=1.0.0
          - websockets>=13.0
          - fastembed>=0.5.1,<0.6
