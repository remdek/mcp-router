services:
  mcp-router:
    build:
      context: .
      args:
        PLAYWRIGHT_INSTALL: ${PLAYWRIGHT_INSTALL:-false}
    container_name: mcp-router
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8000}:${MCP_ROUTER_PORT:-8000}"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    env_file:
      - .env
    environment:
      # Container paths for the bind mounts above (override host-relative .env defaults)
      REGISTRY_PATH: /app/config/registry.json
      INDEX_DB_PATH: /app/data/tools.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MCP_ROUTER_PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
