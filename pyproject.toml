[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-router"
version = "0.1.0"
description = "MCP proxy with lazy tool loading and hybrid search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "mcp>=1.12.0,<2",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "aiosqlite>=0.20.0",
    "sqlite-vec>=0.1.6",
    "python-dotenv>=1.0.0",
    "websockets>=13.0",
    "fastembed>=0.5.1,<0.6",
]

[project.optional-dependencies]
dev = [
    "import-linter>=2.1",
    "mypy>=1.15.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.9.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
mcp-router = "mcp_router.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_router"]

[tool.hatch.build.targets.sdist]
only-include = ["src/mcp_router", "config", "scripts", "README.md", "pyproject.toml"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["mcp_router"]
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sqlite_vec.*", "mcp.*", "fastembed.*", "numpy.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.importlinter]
root_package = "mcp_router"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Services do not import HTTP/CLI adapters"
type = "forbidden"
source_modules = ["mcp_router.services"]
forbidden_modules = [
    "mcp_router.http_server",
    "mcp_router.http_middleware",
    "mcp_router.http_mcp_tools",
    "mcp_router.cli",
]
as_packages = true

[[tool.importlinter.contracts]]
name = "Index does not import HTTP/CLI adapters"
type = "forbidden"
source_modules = ["mcp_router.index"]
forbidden_modules = [
    "mcp_router.http_server",
    "mcp_router.http_middleware",
    "mcp_router.http_mcp_tools",
    "mcp_router.cli",
]
as_packages = true

[[tool.importlinter.contracts]]
name = "Storage is a leaf below services/index"
type = "forbidden"
source_modules = ["mcp_router.storage"]
forbidden_modules = [
    "mcp_router.http_server",
    "mcp_router.http_middleware",
    "mcp_router.http_mcp_tools",
    "mcp_router.cli",
    "mcp_router.services",
    "mcp_router.index",
    "mcp_router.transports",
    "mcp_router.embedding",
]
as_packages = true

[[tool.importlinter.contracts]]
name = "Transports do not import outer layers"
type = "forbidden"
source_modules = ["mcp_router.transports"]
forbidden_modules = [
    "mcp_router.http_server",
    "mcp_router.http_middleware",
    "mcp_router.http_mcp_tools",
    "mcp_router.cli",
    "mcp_router.services",
    "mcp_router.index",
    "mcp_router.storage",
    "mcp_router.embedding",
]
as_packages = true

[[tool.importlinter.contracts]]
name = "Models are a pure leaf"
type = "forbidden"
source_modules = ["mcp_router.models"]
forbidden_modules = [
    "mcp_router.http_server",
    "mcp_router.http_middleware",
    "mcp_router.http_mcp_tools",
    "mcp_router.cli",
    "mcp_router.services",
    "mcp_router.index",
    "mcp_router.storage",
    "mcp_router.transports",
    "mcp_router.embedding",
    "mcp_router.config",
]
as_packages = true

[[tool.importlinter.contracts]]
name = "Embedding does not import HTTP/services/index"
type = "forbidden"
source_modules = ["mcp_router.embedding"]
forbidden_modules = [
    "mcp_router.http_server",
    "mcp_router.http_middleware",
    "mcp_router.http_mcp_tools",
    "mcp_router.cli",
    "mcp_router.services",
    "mcp_router.index",
    "mcp_router.storage",
    "mcp_router.transports",
]
as_packages = true
