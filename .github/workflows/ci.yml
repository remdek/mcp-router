name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: lint-imports
      - run: pre-commit run --all-files
      - run: pytest -q
